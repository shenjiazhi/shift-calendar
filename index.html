<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><title>我的上二休二</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f4f7;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding:16px 13px 90px}h1{font-size:22px;margin:3px 0}.muted{font-size:12px;color:#7a8795}.card{margin:14px 0;padding:15px;border-radius:18px;background:#f7f9fb}.big{font-size:25px;font-weight:800;margin:5px 0}.work{color:#18794e}.rest{color:#1769aa}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stat{background:white;border-radius:12px;padding:10px;font-size:12px}.stat b{display:block;font-size:17px;margin-top:2px}.bar{display:flex;gap:7px;align-items:center;margin:12px 0}.bar .title{flex:1;text-align:center;font-weight:800;font-size:18px}button,select,input{border:0;border-radius:11px;padding:10px 11px;background:#eef2f6;font-size:14px;color:#26313c}.jump{display:flex;gap:6px;margin-bottom:8px}.jump input{min-width:0;flex:1;border:1px solid #dde3e9;background:white}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;color:#7d8996;font-size:11px;padding:7px 0}.day{min-height:79px;border-radius:11px;padding:6px 2px;text-align:center;background:#f7f8fa;border:1px solid transparent}.day.w{background:#eaf6ee}.day.r{background:#eaf3fb}.day.now{border:2px solid #222}.day.empty{background:transparent}.num{font-size:15px;font-weight:800}.lunar{font-size:9px;color:#84909b;margin-top:1px}.shift{font-size:11px;font-weight:800;margin-top:4px}.holiday{font-size:9px;color:#d46800;line-height:1.15;margin-top:3px}.adjust{font-size:9px;color:#7b3fc6}.legend{font-size:11px;color:#6f7b87;margin:10px 2px}.note{font-size:12px;line-height:1.55;background:#fafafa;padding:11px;border-radius:12px;color:#65717e}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;background:#fff;border-top:1px solid #e8ebef;padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:8px}.bottom button{flex:1}.primary{background:#1f6feb;color:white}.danger{color:#b42318}dialog{border:0;border-radius:18px;width:min(91vw,400px);padding:18px;box-shadow:0 15px 50px #0003}dialog::backdrop{background:#0005}dialog select{width:100%;margin:7px 0 14px;border:1px solid #d9dfe6;background:white}.actions{display:flex;justify-content:flex-end;gap:7px}.history{max-height:300px;overflow:auto}.hist{padding:9px 0;border-bottom:1px solid #eee;font-size:13px}</style></head>
<body><main class="app"><h1>我的上二休二</h1><div class="muted">2026-09-23 = 上班第1天 · 节假日仅标记，不改变轮班</div>
<section class="card"><div id="todayDate"></div><div id="todayShift" class="big"></div><div id="todayHoliday" class="holiday"></div><div class="stats"><div class="stat">距离下次休息<b id="toRest">—</b></div><div class="stat">本月班次<b id="monthStats">—</b></div></div></section>
<div class="bar"><button id="prev">‹</button><div class="title" id="monthTitle"></div><button id="next">›</button></div>
<div class="jump"><input type="month" id="jumpMonth"><button id="jumpBtn">跳转</button><button id="todayBtn">今天</button></div>
<div class="week"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div><div class="grid" id="grid"></div>
<div class="legend">绿色＝上班　蓝色＝休息　橙字＝国家节假日　★＝手动调班</div>
<div class="note">点击日期调班。设置新的周期位置后，从该日开始自动重新按“上二休二”排列，之前日期不变。节假日只是提示信息，不参与排班。</div></main>
<div class="bottom"><button id="historyBtn">调班记录</button><button id="exportBtn">备份</button><button id="importBtn">恢复</button></div>
<input type="file" id="fileInput" accept=".json" hidden>
<dialog id="dlg"><h3 id="dlgTitle"></h3><div class="muted" id="dlgInfo"></div><select id="shiftSel"><option value="0">上班第1天</option><option value="1">上班第2天</option><option value="2">休息第1天</option><option value="3">休息第2天</option></select><div class="actions"><button id="del" class="danger">删除调班</button><button id="cancel">取消</button><button id="save" class="primary">保存</button></div></dialog>
<dialog id="historyDlg"><h3>调班记录</h3><div class="history" id="historyList"></div><div class="actions"><button id="closeHistory">关闭</button></div></dialog>
<script>
const base='2026-09-23',names=['上班第1天','上班第2天','休息第1天','休息第2天'];
const holidays={'2026-01-01':'元旦','2026-01-02':'元旦','2026-01-03':'元旦','2026-02-15':'春节','2026-02-16':'春节','2026-02-17':'春节','2026-02-18':'春节','2026-02-19':'春节','2026-02-20':'春节','2026-02-21':'春节','2026-02-22':'春节','2026-02-23':'春节','2026-04-04':'清明节','2026-04-05':'清明节','2026-04-06':'清明节','2026-05-01':'劳动节','2026-05-02':'劳动节','2026-05-03':'劳动节','2026-05-04':'劳动节','2026-05-05':'劳动节','2026-06-19':'端午节','2026-06-20':'端午节','2026-06-21':'端午节','2026-09-25':'中秋节','2026-09-26':'中秋节','2026-09-27':'中秋节','2026-10-01':'国庆节','2026-10-02':'国庆节','2026-10-03':'国庆节','2026-10-04':'国庆节','2026-10-05':'国庆节','2026-10-06':'国庆节','2026-10-07':'国庆节'};
let adjustments=JSON.parse(localStorage.getItem('shiftAdjustments')||'{}'),view=new Date(),selected='';
const pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>{let a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const days=(a,b)=>Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/86400000);
function cycle(d){let ks=Object.keys(adjustments).filter(k=>k<=key(d)).sort();if(ks.length){let k=ks.at(-1);return(Number(adjustments[k])+days(d,parse(k)))%4}return((days(d,parse(base))%4)+4)%4}
function lunar(d){try{let s=new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{month:'short',day:'numeric'}).format(d);return s.replace(/\s/g,'')}catch(e){return''}}
function render(){let y=view.getFullYear(),m=view.getMonth();monthTitle.textContent=`${y}年${m+1}月`;jumpMonth.value=`${y}-${pad(m+1)}`;grid.innerHTML='';let first=new Date(y,m,1),off=(first.getDay()+6)%7,total=new Date(y,m+1,0).getDate(),w=0,r=0,todayKey=key(new Date());
for(let i=0;i<off;i++){let e=document.createElement('div');e.className='day empty';grid.appendChild(e)}
for(let n=1;n<=total;n++){let d=new Date(y,m,n),k=key(d),p=cycle(d);p<2?w++:r++;let e=document.createElement('div');e.className=`day ${p<2?'w':'r'} ${k===todayKey?'now':''}`;e.innerHTML=`<div class=num>${n}</div><div class=lunar>${lunar(d)}</div><div class="shift ${p<2?'work':'rest'}">${names[p]}</div>${holidays[k]?`<div class=holiday>${holidays[k]}</div>`:''}${adjustments[k]!==undefined?'<div class=adjust>★已调班</div>':''}`;e.onclick=()=>openAdjust(k,p);grid.appendChild(e)}
monthStats.textContent=`上 ${w} / 休 ${r}`;renderToday()}
function renderToday(){let d=new Date(),k=key(d),p=cycle(d);todayDate.textContent=`今天 · ${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${lunar(d)}`;todayShift.textContent=names[p];todayShift.className=`big ${p<2?'work':'rest'}`;todayHoliday.textContent=holidays[k]||'';let x=0,dd=new Date(d);while(x<5){if(cycle(dd)>=2)break;dd.setDate(dd.getDate()+1);x++}toRest.textContent=x===0?'今天休息':`${x}天`}
function openAdjust(k,p){selected=k;dlgTitle.textContent=`调整 ${k}`;dlgInfo.textContent=`当前：${names[p]}${holidays[k]?' · '+holidays[k]:''}`;shiftSel.value=adjustments[k]!==undefined?adjustments[k]:p;dlg.showModal()}
save.onclick=()=>{adjustments[selected]=Number(shiftSel.value);localStorage.setItem('shiftAdjustments',JSON.stringify(adjustments));dlg.close();render()}
del.onclick=()=>{delete adjustments[selected];localStorage.setItem('shiftAdjustments',JSON.stringify(adjustments));dlg.close();render()}
cancel.onclick=()=>dlg.close();prev.onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};next.onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()}
todayBtn.onclick=()=>{view=new Date();render()};jumpBtn.onclick=()=>{if(jumpMonth.value){let [y,m]=jumpMonth.value.split('-').map(Number);view=new Date(y,m-1,1);render()}}
historyBtn.onclick=()=>{let ks=Object.keys(adjustments).sort();historyList.innerHTML=ks.length?ks.map(k=>`<div class=hist><b>${k}</b>　${names[adjustments[k]]}</div>`).join(''):'<div class=muted>暂无调班记录</div>';historyDlg.showModal()};closeHistory.onclick=()=>historyDlg.close();
exportBtn.onclick=()=>{let blob=new Blob([JSON.stringify({version:2,base,adjustments},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='上二休二调班备份.json';a.click();URL.revokeObjectURL(a.href)}
importBtn.onclick=()=>fileInput.click();fileInput.onchange=async()=>{let f=fileInput.files[0];if(!f)return;try{let o=JSON.parse(await f.text());adjustments=o.adjustments||{};localStorage.setItem('shiftAdjustments',JSON.stringify(adjustments));render();alert('恢复成功')}catch(e){alert('备份文件无法读取')}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
